spring:
  application:
    name: blog-service
  config:
    import: optional:configserver:http://localhost:8777
  cloud:
    config:
      import-check:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888
server:
  port: 8082
  config:
    import: optional:file:.env[.properties]


  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

