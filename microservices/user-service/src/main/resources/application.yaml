spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8777
  cloud:
    config:
      import-check:
        enabled: true
server:
  port: 8081
  config:
    import: optional:file:.env[.properties]


  servlet:
    context-path: /api/v1


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always


rsa:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem